
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRAGLINE — Админ-панель</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d14;color:#edf2fa;font:15px Arial,sans-serif;padding:30px}
main{max-width:720px;margin:40px auto;background:#111925;border:1px solid #283548;border-radius:16px;padding:28px}
h1{margin-top:0;color:#65e6a1}
p{color:#9eacc0}
input,textarea{width:100%;margin:8px 0 18px;padding:13px;border:1px solid #34445a;border-radius:8px;background:#0b111b;color:white;font:inherit}
textarea{min-height:170px;resize:vertical}
button{padding:13px 20px;border:0;border-radius:8px;background:#65e6a1;color:#07130d;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.hidden{display:none}
#status{margin-top:18px;white-space:pre-wrap;color:#65e6a1}
</style>
</head>
<body>
<main>
<h1>FRAGLINE / ADMIN</h1>
<p>Панель публикации новостей</p>

<section id="login">
<h2>Вход администратора</h2>
<input id="email" type="email" placeholder="Электронная почта">
<input id="password" type="password" placeholder="Пароль">
<button id="loginBtn">Войти</button>
</section>

<section id="editor" class="hidden">
<p>Ты вошёл в панель публикации.</p>
<button id="logoutBtn" type="button">Выйти</button>
<h2>Новая новость</h2>
<label>Заголовок</label>
<input id="title" maxlength="150" placeholder="Заголовок новости">
<label>Краткое описание</label>
<textarea id="excerpt" maxlength="500" style="min-height:90px" placeholder="Краткое описание для карточки"></textarea>
<label>Текст новости</label>
<textarea id="body" placeholder="Текст новости"></textarea>
<label>Обложка (до 5 МБ)</label>
<input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<button id="publishBtn">Опубликовать новость</button>
</section>
<div id="status"></div>
</main>

<script>
const SUPABASE_URL = "https://wqcpbeizujufmnzonjxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_FrGYTKcu5HfqE-rBMHSurg_-JyrFH-K";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/publish-news";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const status = message => $("status").textContent = message;

async function refreshSession(){
  const {data:{session}} = await supabase.auth.getSession();
  $("login").classList.toggle("hidden", !!session);
  $("editor").classList.toggle("hidden", !session);
}

$("loginBtn").onclick = async () => {
  status("Входим...");
  const {error} = await supabase.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){status("Ошибка входа: "+error.message);return;}
  status("Вход выполнен.");
  await refreshSession();
};

$("logoutBtn").onclick = async () => {
  await supabase.auth.signOut();
  status("Ты вышел из панели.");
  await refreshSession();
};

$("publishBtn").onclick = async () => {
  const title = $("title").value.trim();
  const excerpt = $("excerpt").value.trim();
  const body = $("body").value.trim();
  const file = $("cover").files[0];

  if(!title || !excerpt || !body){
    status("Заполни заголовок, описание и текст новости.");
    return;
  }
  if(file && file.size > 5*1024*1024){
    status("Файл больше 5 МБ.");
    return;
  }

  const {data:{session}} = await supabase.auth.getSession();
  if(!session){status("Сначала войди.");await refreshSession();return;}

  const button = $("publishBtn");
  button.disabled = true;
  status("Публикуем новость...");

  try{
    let cover = null;
    if(file){
      const base64 = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      cover = {name:file.name,base64};
    }

    const response = await fetch(FUNCTION_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+session.access_token
      },
      body:JSON.stringify({title,excerpt,body,cover})
    });

    const result = await response.json();
    if(!response.ok) throw new Error(result.error || JSON.stringify(result));

    status("Новость опубликована! Она сохранена в GitHub.");
    $("title").value="";
    $("excerpt").value="";
    $("body").value="";
    $("cover").value="";
  }catch(error){
    status("Ошибка: "+error.message);
  }finally{
    button.disabled = false;
  }
};

refreshSession();
</script>
</body>
</html>
